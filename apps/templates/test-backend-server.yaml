apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-backend-server
  namespace: argocd
spec:
  project: default
  source:
      repoURL: "https://github.com/cash4dog/final"
      targetRevision: main
      path: workloads/test-backend-server
  destination:
      server: "https://kubernetes.default.svc"
      namespace: argocd
  syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
  template:
    metadata:
      annotations:
        # ArgoCD автоматично підставить сюди унікальний SHA-хеш під час деплою
        git-commit-sha: "{{ .Values.gitCommitSha }}"