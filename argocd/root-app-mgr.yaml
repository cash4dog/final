apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app-mgr
  namespace: argocd
spec:
  project: default
  source:
      repoURL: "https://github.com/cash4dog/final"
      targetRevision: HEAD
      path: apps
  destination:
      server: "https://kubernetes.default.svc"
  syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
